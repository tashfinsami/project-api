<!DOCTYPE html>
<html>
    <head>
        <script>
            /* =====================
                AUTO CHECK LOGIN
            ===================== */
            if (!localStorage.getItem("token")) {
                window.location.href = "index.html";
            }
        </script>

        <title>User Dashboard</title>

        <style>
            body { font-family: Arial; margin: 20px; }

            .dashboard-title {
                border-bottom: 1px solid #ccc;
                padding-bottom: 10px;
                margin-bottom: 30px;
            }

            .box {
                border: 1px solid #ccc;
                padding: 12px;
                margin: 10px 0;
            }

            input {
                margin: 5px;
                padding: 6px;
            }

            button {
                margin: 5px;
                padding: 6px 10px;
                cursor: pointer;
            }

            .section {
                margin-bottom: 25px;
            }
        </style>
    </head>

    <body>

        <h2 class="dashboard-title">My Dashboard</h2>

        <div class="section">
            <h3>Profile</h3>
            <!-- //already in window onload
            <button onclick="loadMe()">Load Profile</button>
            -->
            <div id="meBox" class="box"></div>
        </div>

        <hr>

        <div class="section">
            <h3>Update Profile</h3>

            <div class="box">
                <input id="up_name" placeholder="New Name"><br>
                <input id="up_email" placeholder="New Email"><br>
                <button onclick="updateMe()">Update</button>
            </div>
        </div>

        <hr>

        <div class="section">
            <h3>Delete Account</h3>

            <div class="box">
                <p>Danger zone</p>
                <button onclick="deleteMe()" style="background:red;color:white;">
                    Delete My Account
                </button>
            </div>
        </div>

        <hr>

        <div class="section">
            <h3>All Users</h3>

            <input id="pageInput" type="number" placeholder="Page number (at least 1)">
            <button onclick="getAll()">Load Users</button>

            <div id="list"></div>
        </div>

        <hr>

        <div class="section">
            <h3>Search by Email</h3>

            <input id="searchEmail" placeholder="Email">
            <button onclick="searchEmail()">Search</button>

            <div id="emailBox"></div>
        </div>

        <hr>

        <button onclick="logout()" style="background:#111;color:#fff;">
            Logout
        </button>

        <script>

        const API = "profile.php";

        /* =====================
        GET TOKEN
        ===================== */
        function getToken() {
            return localStorage.getItem("token");
        }

        /* =====================
        AUTH HEADER
        ===================== */
        function authHeaders() {
            return {
                "Content-Type": "application/json",
                "Authorization": "Bearer " + getToken()
            };
        }

        /* =====================
        LOAD PROFILE
        ===================== */
        function loadMe() {

            fetch(API + "/me", {
                method: "GET",
                headers: authHeaders()
            })
            .then(res => res.json())
            .then(data => {

                if (data.status === "error") {
                    document.getElementById("meBox").innerHTML = data.message;
                    return;
                }

                const user = data?.data?.user;

                document.getElementById("meBox").innerHTML = `
                    <b>ID:</b> ${user.id}<br>
                    <b>Name:</b> ${user.name}<br>
                    <b>Email:</b> ${user.email}
                `;
            });
        }

        /* =====================
        UPDATE PROFILE
        ===================== */
        function updateMe() {

            let name = document.getElementById("up_name").value;
            let email = document.getElementById("up_email").value;

            fetch(API + "/me", {
                method: "PUT",
                headers: authHeaders(),
                body: JSON.stringify({ name, email })
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                loadMe();
            });
        }

        /* =====================
        DELETE PROFILE
        ===================== */
        function deleteMe() {

            if (!confirm("Are you sure?")) return;

            fetch(API + "/me", {
                method: "DELETE",
                headers: authHeaders()
            })
            .then(res => res.json())
            .then(data => {
                alert(data.message);
                logout();
            });
        }

        /* =====================
        ALL USERS
        ===================== */
        function getAll() {

        // get page from input
        let page = document.getElementById("pageInput").value;
        //set limit
        let limit = 5;

        // frontend check
        if (!page || page < 1) {
            document.getElementById("list").innerHTML =
                "Page must be a valid number";
            return;
        }

        fetch(API + "/users?page=" + page + "&limit=" + limit, {
            method: "GET",
            headers: authHeaders()
        })
        .then(res => res.json())
        .then(data => {

            if (data.status === "error") {
                document.getElementById("list").innerHTML = data.message;
                return;
            }

            let html = "";

            const users = data?.data?.users || [];

            users.forEach(user => {
                html += `
                    <div class="box">
                        <b>ID:</b> ${user.id}<br>
                        <b>Name:</b> ${user.name}<br>
                        <b>Email:</b> ${user.email}
                    </div>
                `;
            });

            document.getElementById("list").innerHTML = html;
        });
        }

        /* =====================
        SEARCH EMAIL
        ===================== */
        function searchEmail() {

            let email = document.getElementById("searchEmail").value;

            fetch(API + "/users?email=" + encodeURIComponent(email), {
                method: "GET",
                headers: authHeaders()
            })
            .then(res => res.json())
            .then(data => {

                if (data.status === "error") {
                    document.getElementById("emailBox").innerHTML = data.message;
                    return;
                }

                const user = data?.data?.user;

                document.getElementById("emailBox").innerHTML = `
                    <div class="box">
                        <b>ID:</b> ${user.id}<br>
                        <b>Name:</b> ${user.name}<br>
                        <b>Email:</b> ${user.email}
                    </div>
                `;
            });
        }

        /* =====================
        LOGOUT (JWT STYLE)
        ===================== */
        function logout() {
            localStorage.removeItem("token");
            window.location.href = "index.html";
        }

        /* =====================
        AUTO LOAD DETAILS
        ===================== */
        window.onload = function () {
            loadMe();
        };

        </script>
    </body>
</html>
